<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate of Participation — Template Reference</title>
  <style>
    /*
      Reference HTML layout for the fixed CertiBatch certificate design.
      Actual PDFs are generated by certificate.py using ReportLab.
      Placeholders: {{name}}, {{event_name}}, {{issue_date}},
      {{certificate_id}}, {{organization_name}}
    */
    @page { size: A4 landscape; margin: 0; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #4a4a4a;
    }
    .frame {
      box-sizing: border-box;
      width: 297mm;
      height: 210mm;
      border: 8px solid #8a8a8a;
      outline: 1px solid #6b6b6b;
      outline-offset: -14mm;
      padding: 28mm 40mm;
      text-align: center;
      position: relative;
    }
    h1 {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      font-size: 36pt;
      letter-spacing: 0.2em;
      color: #c9a227;
      font-weight: bold;
    }
    h2 {
      margin: 4px 0 16px;
      font-family: "Times New Roman", Times, serif;
      font-size: 18pt;
      letter-spacing: 0.25em;
      color: #c9a227;
    }
    .diamonds { color: #b0b0b0; letter-spacing: 0.8em; margin-bottom: 18px; }
    .presented {
      font-size: 10pt;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .name {
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 32pt;
      color: #c9a227;
      margin: 8px 0 20px;
    }
    .body { font-size: 11pt; line-height: 1.5; max-width: 70%; margin: 0 auto 40px; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20mm;
      margin-top: 30px;
    }
    .field { width: 50mm; border-top: 1px solid #6b6b6b; padding-top: 6px; font-size: 8pt; }
    .seal {
      width: 44mm;
      height: 44mm;
      border-radius: 50%;
      background: #c9a227;
      color: #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9pt;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>CERTIFICATE</h1>
    <h2>OF PARTICIPATION</h2>
    <div class="diamonds">◇ ◇ ◇</div>
    <p class="presented">This certificate is presented to</p>
    <p class="name">{{name}}</p>
    <p class="body">
      for successfully participating in {{event_name}}
      organized by {{organization_name}}.
      Certificate ID: {{certificate_id}}
    </p>
    <div class="footer">
      <div class="field">{{issue_date}}<br />DATE</div>
      <div class="seal">BEST<br />AWARD</div>
      <div class="field">{{organization_name}}<br />SIGNATURE</div>
    </div>
  </div>
</body>
</html>
